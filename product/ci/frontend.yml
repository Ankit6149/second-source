# Maintainer: review, then copy this file to .github/workflows/frontend.yml.
name: Frontend acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: product
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: product
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
        working-directory: product
      - run: npm test
        working-directory: product
      - run: npm run test:dom
        working-directory: product
      - run: npm run test:dom-integration
        working-directory: product
      - run: npm run test:browser
        working-directory: product
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: .runs/browser-acceptance
          if-no-files-found: ignore
