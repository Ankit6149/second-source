[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "second-source"
version = "0.0.1"
description = "Scope-aware, auditable black-box reconstruction foundations"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "fastapi==0.162.0", "starlette==1.10.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
cloud = ["psycopg[binary]==3.2.10"]
dev = ["pytest>=8,<10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"second_source.backend" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
