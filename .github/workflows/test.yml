name: Second Source tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-and-g2:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        env:
          SECOND_SOURCE_MAX_RUN_USD: '0'
        run: python -m pytest -q
      - name: Deterministic demonstration
        run: python -m second_source.demo
      - name: Verify operator Windows bootstrap script
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-windows.ps1

  mcp-protocol:
    name: MCP v2 in-memory protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and official MCP SDK
        run: python -m pip install -e ".[dev,mcp]"
      - name: Run MCP evidence and client protocol tests
        env:
          SECOND_SOURCE_MAX_RUN_USD: '0'
        run: python -m pytest tests/test_mcp_evidence.py -q
