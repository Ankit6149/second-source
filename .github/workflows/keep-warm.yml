name: keep-warm

# Render's free instance sleeps after ~15 min idle, which would greet
# judges with a 50s cold start. Ping the health endpoints every 10 min
# during the judging window so the hosted app answers immediately.
# Free-tier budget: ~720 instance-hours/month always-on vs 750 included.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render API health
        run: |
          curl -fsS -m 120 https://second-source-api.onrender.com/health/live
          echo
          curl -fsS -m 120 https://second-source-api.onrender.com/health/ready || true
      - name: Ping production site
        run: curl -fsSI -m 60 https://second-source-alpha.vercel.app/ | head -1
